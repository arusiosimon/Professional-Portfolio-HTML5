<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Unique title for the contact page -->
    <title>Contact  My Professional Portfolio</title>
</head>

<body>

    <!-- Header contains the page heading and site navigation -->
    <header>
        <h1>Contact Me</h1>

        <!-- Relative hyperlinks connect all five portfolio pages -->
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="data.html">Data</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main contains the primary contact information and form -->
    <main>

        <section>
            <h2>Get In Touch</h2>

            <p>
                If you would like to contact me about my work, skills,
                or professional opportunities, you can use the form below.
            </p>

            <!--
                The form collects contact information.
                Labels are provided for accessibility so users can
                clearly identify the purpose of each input field.
            -->
            <form action="#" method="post">

                <!-- Name field -->
                <p>
                    <label for="name">Full Name:</label>
                    <input type="text"
                           id="name"
                           name="name"
                           required>
                </p>

                <!-- Email field uses the HTML5 email type -->
                <p>
                    <label for="email">Email Address:</label>
                    <input type="email"
                           id="email"
                           name="email"
                           required>
                </p>

                <!-- Phone field uses the HTML5 telephone type -->
                <p>
                    <label for="phone">Phone Number:</label>
                    <input type="tel"
                           id="phone"
                           name="phone"
                           required>
                </p>

                <!-- Message field allows the visitor to write a message -->
                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message"
                              name="message"
                              rows="6"
                              cols="40"
                              required></textarea>
                </p>

                <!-- Submit button sends the form -->
                <p>
                    <button type="submit">Send Message</button>
                </p>

            </form>

        </section>

    </main>

    <!-- Footer provides closing information about the website -->
    <footer>
        <p>&copy; 2026 My Professional Portfolio</p>
    </footer>

</body>
</html>
